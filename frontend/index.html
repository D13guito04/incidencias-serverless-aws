<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Incidencias</title>
</head>
<body>
  <h1>Gestión de incidencias</h1>
  <p id="estado">Cargando...</p>
  <button id="login">Iniciar sesión</button>
  <button id="logout" hidden>Cerrar sesión</button>

  <script>
    const COGNITO_DOMAIN = "https://eu-west-1hv919bloz.auth.eu-west-1.amazoncognito.com";
    const CLIENT_ID = "51k0hhrmfhv2gq43724djc1mf4";
    const REDIRECT_URI = "https://d2kqqlxt0valpy.cloudfront.net";

    const estado = document.getElementById("estado");
    const botonLogin = document.getElementById("login");
    const botonLogout = document.getElementById("logout");

    // Tokens solo en memoria: se pierden al recargar la página
    let tokens = null;

    function generarAleatorio(longitud) {
      const caracteres = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";
      const valores = crypto.getRandomValues(new Uint8Array(longitud));
      return Array.from(valores, v => caracteres[v % caracteres.length]).join("");
    }

    async function sha256(texto) {
      const datos = new TextEncoder().encode(texto);
      return new Uint8Array(await crypto.subtle.digest("SHA-256", datos));
    }

    function base64url(bytes) {
      return btoa(String.fromCharCode(...bytes))
        .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }

    function decodificarJwt(token) {
      const payload = token.split(".")[1]
        .replace(/-/g, "+").replace(/_/g, "/");
      const relleno = "=".repeat((4 - payload.length % 4) % 4);
      const bytes = Uint8Array.from(atob(payload + relleno), c => c.charCodeAt(0));
      return JSON.parse(new TextDecoder().decode(bytes));
    }

    async function canjearCodigo(codigo) {
      const verifier = sessionStorage.getItem("pkce_verifier");
      sessionStorage.removeItem("pkce_verifier");
      const cuerpo = new URLSearchParams({
        grant_type: "authorization_code",
        client_id: CLIENT_ID,
        code: codigo,
        redirect_uri: REDIRECT_URI,
        code_verifier: verifier
      });
      const respuesta = await fetch(COGNITO_DOMAIN + "/oauth2/token", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: cuerpo
      });
      return respuesta.json();
    }

    function mostrarSesion() {
      const datos = decodificarJwt(tokens.id_token);
      estado.textContent = "Sesión iniciada como " + datos.email;
      botonLogin.hidden = true;
      botonLogout.hidden = false;
    }

    botonLogin.addEventListener("click", async () => {
      const verifier = generarAleatorio(64);
      sessionStorage.setItem("pkce_verifier", verifier);
      const challenge = base64url(await sha256(verifier));

      const url = new URL(COGNITO_DOMAIN + "/login");
      url.searchParams.set("client_id", CLIENT_ID);
      url.searchParams.set("response_type", "code");
      url.searchParams.set("scope", "openid email");
      url.searchParams.set("redirect_uri", REDIRECT_URI);
      url.searchParams.set("code_challenge_method", "S256");
      url.searchParams.set("code_challenge", challenge);
      window.location.href = url.toString();
    });

    botonLogout.addEventListener("click", () => {
      tokens = null;
      estado.textContent = "Página inicial. No hay sesión iniciada.";
      botonLogin.hidden = false;
      botonLogout.hidden = true;
    });

    const codigo = new URLSearchParams(window.location.search).get("code");
    if (codigo) {
      history.replaceState({}, "", window.location.pathname);
      estado.textContent = "Código recibido de Cognito. Canjeando...";
      canjearCodigo(codigo).then(datos => {
        if (datos.id_token) {
          tokens = datos;
          mostrarSesion();
        } else {
          estado.textContent = "Error al canjear el código: " + (datos.error || "desconocido");
        }
      });
    } else {
      estado.textContent = "Página inicial. No hay sesión iniciada.";
    }
  </script>
</body>
</html>
